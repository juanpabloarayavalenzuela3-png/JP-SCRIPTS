if (data.seguridad.esPeligroso) {
  let htmlAlertas = "<h3>⚠️ Amenazas Detectadas:</h3>";
  
  data.seguridad.detalles.forEach(alerta => {
    htmlAlertas += `
      <div style="background: #2a1515; border-left: 4px solid #ff4444; padding: 10px; margin-bottom: 8px;">
        <p style="margin: 0; color: #ff8888;">${alerta.mensaje}</p>
        <code style="background: #150a0a; color: #ffcccc; padding: 2px 6px; display: block; margin-top: 5px;">
          ${alerta.linea}
        </code>
      </div>
    `;
  });

  document.getElementById('contenedor-alertas').innerHTML = htmlAlertas;
}
