<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP SOURCES - Enviador Individual</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 { color: #00ff88; text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 8px; }
    input[type="password"], input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
    }
    input[type="file"] { cursor: pointer; }
    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #00ff88;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
    }
    button:hover { background: #00cc6a; }
    #lista-archivos {
      margin-top: 15px;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 14px;
    }
    .archivo-item {
      padding: 4px 8px;
      border-bottom: 1px solid #333;
      color: #00ff88;
    }
    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      display: none;
      font-weight: bold;
    }
    .success { background: #1b432e; color: #00ff88; border: 1px solid #00ff88; }
    .error { background: #431b1b; color: #ff4d4d; border: 1px solid #ff4d4d; }
  </style>
</head>
<body>

  <h1>JP SOURCES</h1>

  <label for="password">Contraseña de Acceso:</label>
  <input type="password" id="password" placeholder="Escribe la contraseña..." />

  <label for="fileInput">Seleccionar Archivos (Mantén presionado para elegir varios):</label>
  <input type="file" id="fileInput" multiple onchange="mostrarArchivos(this)" />

  <div id="lista-archivos" style="display: none;">
    <strong>Archivos seleccionados:</strong>
    <div id="nombres-archivos"></div>
  </div>

  <button id="btnEnviar" onclick="enviarArchivos()">Enviar Archivos a Discord</button>

  <div id="status"></div>

  <script>
    function mostrarArchivos(input) {
      const contenedor = document.getElementById('lista-archivos');
      const nombresDiv = document.getElementById('nombres-archivos');
      nombresDiv.innerHTML = '';

      if (input.files && input.files.length > 0) {
        for (let i = 0; i < input.files.length; i++) {
          const item = document.createElement('div');
          item.className = 'archivo-item';
          item.innerText = `📄 ${input.files[i].name}`;
          nombresDiv.appendChild(item);
        }
        contenedor.style.display = 'block';
      } else {
        contenedor.style.display = 'none';
      }
    }

    async function enviarArchivos() {
      const pass = document.getElementById('password').value;
      const fileInput = document.getElementById('fileInput');
      const btn = document.getElementById('btnEnviar');

      if (!pass) {
        mostrarEstado('Por favor ingresa la contraseña.', false);
        return;
      }

      if (!fileInput.files || fileInput.files.length === 0) {
        mostrarEstado('Por favor selecciona los archivos primero.', false);
        return;
      }

      const total = fileInput.files.length;
      btn.disabled = true;

      // Recorrer y enviar ARCHIVO POR ARCHIVO (1 mensaje por archivo)
      for (let i = 0; i < total; i++) {
        const archivoActual = fileInput.files[i];
        
        mostrarEstado(`Enviando (${i + 1}/${total}): ${archivoActual.name}...`, true);

        const formData = new FormData();
        formData.append('password', pass);
        formData.append('files', archivoActual);

        try {
          const response = await fetch('/api/upload-webhook', {
            method: 'POST',
            body: formData
          });

          if (!response.ok) {
            const data = await response.json();
            mostrarEstado(`Error en el archivo ${archivoActual.name}: ` + (data.error || 'Acceso denegado.'), false);
            btn.disabled = false;
            return;
          }
        } catch (err) {
          mostrarEstado(`Error de conexión al enviar ${archivoActual.name}`, false);
          btn.disabled = false;
          return;
        }

        // Espera 1 segundo entre envíos para no sobrecargar la Webhook de Discord
        await new Promise(resolve => setTimeout(resolve, 1000));
      }

      mostrarEstado(`¡Proceso completado! Se enviaron ${total} mensajes a Discord.`, true);
      fileInput.value = ''; 
      document.getElementById('lista-archivos').style.display = 'none';
      btn.disabled = false;
    }

    function mostrarEstado(msg, esExito) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = msg;
      statusDiv.className = esExito ? 'success' : 'error';
      statusDiv.style.display = 'block';
    }
  </script>
</body>
</html>
