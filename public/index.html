<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JP SCRIPTS - Generador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #00ff88; text-align: center; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; }
    input[type="text"], textarea, input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 5px;
      box-sizing: border-box;
    }
    input[type="file"] { cursor: pointer; }
    textarea { height: 180px; font-family: monospace; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #00ff88;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover { background: #00cc6a; }
    #resultado { margin-top: 20px; padding: 15px; background: #1e1e1e; border-radius: 5px; display: none; }
    .loadstring { font-family: monospace; background: #000; padding: 10px; border-radius: 3px; word-break: break-all; }
  </style>
</head>
<body>

  <h1>JP SCRIPTS - Generador</h1>

  <label for="originalTitle">Nombre exacto del menú a cambiar (Opcional):</label>
  <input type="text" id="originalTitle" placeholder="Ej: MAPLE HUB, 7TY ANTI LAG, PET FINDER" />

  <label for="fileInput">Seleccionar archivo de script (.lua o .txt):</label>
  <input type="file" id="fileInput" accept=".lua,.txt" onchange="cargarArchivo(event)" />

  <label for="scriptCode">O pega aquí el Código Lua:</label>
  <textarea id="scriptCode" placeholder="Pega aquí tu script Lua completo..."></textarea>

  <button onclick="subirScript()">Procesar Script</button>

  <div id="resultado">
    <h3>¡Script Procesado!</h3>
    <p><strong>Loadstring para tu ejecutor:</strong></p>
    <div id="loadstringOutput" class="loadstring"></div>
  </div>

  <script>
    // Carga el texto del archivo directamente en el área de texto
    function cargarArchivo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('scriptCode').value = e.target.result;
      };
      reader.readAsText(file);
    }

    async function subirScript() {
      const source = document.getElementById('scriptCode').value;
      const customTitle = document.getElementById('originalTitle').value;

      if (!source.trim()) {
        alert('Por favor selecciona un archivo o pega un script antes de procesar.');
        return;
      }

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: source,
            filename: 'script',
            customTitle: customTitle
          })
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('loadstringOutput').innerText = data.loadstring;
          document.getElementById('resultado').style.display = 'block';
        } else {
          alert('Error: ' + (data.error || 'No se pudo procesar el script'));
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    }
  </script>
</body>
</html>
