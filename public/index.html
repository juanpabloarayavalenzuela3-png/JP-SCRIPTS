<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador RAW Protegido</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
    h2 { color: #00ff66; margin-bottom: 10px; }
    textarea { width: 100%; height: 220px; background: #222; color: #00ff66; border: 1px solid #444; padding: 10px; box-sizing: border-box; font-family: monospace; border-radius: 6px; }
    button { width: 100%; background: #00ff66; color: #000; font-weight: bold; padding: 14px; border: none; margin-top: 10px; border-radius: 6px; font-size: 16px; }
    input { width: 100%; padding: 12px; margin-top: 10px; background: #222; color: #fff; border: 1px solid #444; box-sizing: border-box; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Pega tu Source Lua</h2>
  <textarea id="code" placeholder="print('Hola mundo')"></textarea>
  <button onclick="subir()">Generar RAW Protegido</button>

  <h3>Enlace RAW para Delta:</h3>
  <input type="text" id="resultado" readonly placeholder="Aquí aparecerá tu link..." />

  <script>
    async function subir() {
      const text = document.getElementById('code').value;
      if (!text) return alert('Pega un script primero');
      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: text
      });
      const data = await res.json();
      document.getElementById('resultado').value = data.raw_url;
    }
  </script>
</body>
</html>
